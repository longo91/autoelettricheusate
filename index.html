<!DOCTYPE html>
  <html lang="it">
  <head>
  <meta charset="UTF-8">
  <title>Auto Elettriche Usate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:0; }
header { background:#0a7a4a; color:#fff; padding:20px; text-align:center; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:20px; padding:20px; max-width:1200px; margin:0 auto; }
.card { background:#fff; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); overflow:hidden; }
  .card-body { padding:15px; }
.card h3 { margin:0 0 8px; }
.price { font-size:1.3em; font-weight:bold; color:#0a7a4a; }
.meta { color:#666; font-size:0.9em; margin:8px 0; }
.loading, .empty { text-align:center; padding:40px; color:#666; }
</style>
  </head>
  <body>
  <header>
  <h1>Auto Elettriche Usate</h1>
<p>Annunci di auto elettriche e plug-in hybrid usate</p>
</header>
<div id="app" class="grid">
<p class="loading">Caricamento annunci...</p>
  </div>
  <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://komvmedptbcsiiswoaja.supabase.co';
const SUPABASE_KEY = 'sb_publishable_W1l56uhiAnI6g7rhvkqtZg_WesZk_rd';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById('app');

async function loadAnnunci() {
const { data, error } = await supabase.from('annunci').select('*').eq('stato', 'attivo').order('creato_il', { ascending: false });

if (error) {
app.innerHTML = '<p class="empty">Errore nel caricamento degli annunci.</p>';
console.error(error);
return;
}

if (!data || data.length === 0) {
app.innerHTML = '<p class="empty">Nessun annuncio disponibile al momento.</p>';
return;
}

app.innerHTML = data.map(annuncioCard).join('');
}

function annuncioCard(a) {
const prezzo = new Intl.NumberFormat('it-IT').format(a.prezzo);
const km = new Intl.NumberFormat('it-IT').format(a.km);
const provinciaTxt = a.prov ? '(' + a.prov + ')' : '';
return '<div class="card"><div class="card-body">' +
'<h3>' + a.marca + ' ' + a.modello + ' ' + (a.versione || '') + '</h3>' +
'<div class="price">' + prezzo + ' €</div>' +
'<div class="meta">' + a.anno + ' · ' + km + ' km · ' + a.alimentazione + '</div>' +
'<div class="meta">' + a.citta + ' ' + provinciaTxt + ' · ' + a.tipo_venditore + '</div>' +
'<p>' + (a.descrizione || '') + '</p>' +
'</div></div>';
}

loadAnnunci();
</script>
</body>
</html>
