<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Auto Elettriche Usate | Annunci EV e plug-in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Annunci di auto elettriche e plug-in hybrid usate da privati e rivenditori.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<!-- HEADER -->
<header>
  <div class="brand">
    <div class="bolt">⚡</div>
    <span>Auto EV</span>
  </div>
  <div class="header-center">
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="headerSearch" placeholder="Cerca per modello o marca...">
    </div>
  </div>
  <div class="header-right">
    <button id="btnPublish" class="btn-publish">+ Pubblica</button>
    <div class="user-menu">
      <button id="btnAuth" class="btn-auth">Accedi</button>
      <div class="user-profile" style="display: none;">
        <div class="user-avatar">M</div>
        <span>Menu</span>
      </div>
    </div>
  </div>
</header>

<!-- HERO SECTION -->
<section class="hero">
  <h1>Trova la tua Auto Elettrica</h1>
  <p>Annunci verificati di EV e plug-in hybrid usate da privati e concessionari</p>
  <div class="hero-search">
    <input type="text" id="heroSearch" placeholder="Marca o modello...">
    <button id="heroSearchBtn">Cerca</button>
  </div>
</section>

<!-- FILTERS SECTION -->
<section class="filters-section">
  <div class="container">
    <h3 class="filters-title">Filtra Risultati</h3>
    <div class="filters-grid">
      <!-- Marca -->
      <div class="filter-group">
        <label class="filter-label">Marca</label>
        <select class="filter-select" id="filterBrand">
          <option value="">Tutte le marche</option>
          <option value="tesla">Tesla</option>
          <option value="nissan">Nissan</option>
          <option value="renault">Renault</option>
          <option value="volkswagen">Volkswagen</option>
          <option value="hyundai">Hyundai</option>
          <option value="kia">Kia</option>
          <option value="fiat">Fiat</option>
          <option value="bmw">BMW</option>
          <option value="audi">Audi</option>
          <option value="other">Altra marca</option>
        </select>
      </div>

      <!-- Modello -->
      <div class="filter-group">
        <label class="filter-label">Modello</label>
        <input type="text" class="filter-input" id="filterModel" placeholder="Es. Model 3...">
      </div>

      <!-- Tipo -->
      <div class="filter-group">
        <label class="filter-label">Tipo</label>
        <select class="filter-select" id="filterType">
          <option value="">Tutti i tipi</option>
          <option value="ev">Elettrica (EV)</option>
          <option value="phev">Plug-in Hybrid (PHEV)</option>
        </select>
      </div>

      <!-- Anno Da -->
      <div class="filter-group">
        <label class="filter-label">Anno Da</label>
        <select class="filter-select" id="filterYearFrom">
          <option value="">Qualsiasi anno</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
          <option value="2020">2020</option>
          <option value="2019">2019</option>
          <option value="2018">2018</option>
          <option value="2017">2017</option>
          <option value="2016">2016</option>
        </select>
      </div>

      <!-- Anno A -->
      <div class="filter-group">
        <label class="filter-label">Anno A</label>
        <select class="filter-select" id="filterYearTo">
          <option value="">Qualsiasi anno</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
          <option value="2020">2020</option>
          <option value="2019">2019</option>
          <option value="2018">2018</option>
          <option value="2017">2017</option>
          <option value="2016">2016</option>
        </select>
      </div>

      <!-- Prezzo Da - A -->
      <div class="filter-group">
        <label class="filter-label">Prezzo (€)</label>
        <div class="price-range">
          <div class="filter-group">
            <input type="number" class="filter-input" id="filterPriceFrom" placeholder="Da">
          </div>
          <span class="price-range-separator">-</span>
          <div class="filter-group">
            <input type="number" class="filter-input" id="filterPriceTo" placeholder="A">
          </div>
        </div>
      </div>

      <!-- Km da -->
      <div class="filter-group">
        <label class="filter-label">Km massimi</label>
        <input type="number" class="filter-input" id="filterKm" placeholder="Es. 50000">
      </div>

      <!-- Stato -->
      <div class="filter-group">
        <label class="filter-label">Stato</label>
        <select class="filter-select" id="filterState">
          <option value="">Tutti gli stati</option>
          <option value="excellent">Eccellente</option>
          <option value="good">Buono</option>
          <option value="fair">Discreto</option>
        </select>
      </div>

      <!-- Reset Button -->
      <button class="btn-reset" id="btnReset">Ripristina Filtri</button>
    </div>
  </div>
</section>

<!-- MAIN CONTENT -->
<div class="content">
  <div class="toolbar">
    <h2>Annunci</h2>
    <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
      <span class="count"><strong id="adCount">0</strong> annunci trovati</span>
      <div class="sort-control">
        <label>Ordina:</label>
        <select class="sort-select" id="sortBy">
          <option value="recent">Più recenti</option>
          <option value="price-asc">Prezzo crescente</option>
          <option value="price-desc">Prezzo decrescente</option>
          <option value="km-asc">Km minori</option>
        </select>
      </div>
    </div>
  </div>

  <div class="grid" id="grid">
    <!-- cards rendered by JS -->
  </div>
</div>

<script src="/assets/script.js"></script>
</body>
</html>
